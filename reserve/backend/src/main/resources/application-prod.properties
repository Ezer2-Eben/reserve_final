# ============================================================
# Profil PRODUCTION pour Render.com (PostgreSQL)
# ============================================================
# DATABASE_URL (postgres://...) est auto-converti en JDBC via
# RenderDatabaseUrlEnvironmentPostProcessor.
# Ou bien définir SPRING_DATASOURCE_URL / USERNAME / PASSWORD.

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — free tier Render (~512 Mo)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Boot plus rapide sur free tier (512 Mo)
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true

# Port (Render injecte PORT)
server.port=${PORT:10000}
server.address=0.0.0.0

# JWT (HS512 → secret long)
jwt.secret=${JWT_SECRET:cette_cle_est_longue_et_secrete_avec_au_moins_64_caracteres!!1234567890}

# Uploads
app.upload.path=uploads
app.upload.max-size=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.reserve.admin=INFO
logging.level.com.zaxxer.hikari=INFO
